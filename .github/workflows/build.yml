name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh

      - name: Package
        run: |
          ./scripts/make-dmg.sh
          cd build
          ditto -c -k --sequesterRsrc --keepParent CloseFromExpose.app CloseFromExpose.zip
          shasum -a 256 CloseFromExpose.dmg CloseFromExpose.zip | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: CloseFromExpose-${{ steps.version.outputs.version }}
          path: |
            build/CloseFromExpose.dmg
            build/CloseFromExpose.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/CloseFromExpose.dmg build/CloseFromExpose.zip build/SHA256SUMS \
            --title "Close from Exposé $GITHUB_REF_NAME" \
            --generate-notes
